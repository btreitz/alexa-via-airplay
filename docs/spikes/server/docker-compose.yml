# Spike stack for the Docker LXC (.248): two AirPlay 2 receivers on one host
# (test A) and an HTTPS-reachable stream server for the Echo (test B).
# Temporary: remove with `docker compose down -v` after the tests.

name: airplay2-spike

x-room: &room
  image: mikebrady/shairport-sync:5.6
  restart: unless-stopped
  network_mode: host # AirPlay 2 needs mDNS and NQPTP on the LAN
  ipc: host # NQPTP hands its clocks over via /dev/shm
  cap_add:
    - SYS_NICE
  environment:
    ENABLE_NQPTP: 0 # One shared NQPTP below
    ENABLE_AVAHI: 0 # One shared Avahi below
  volumes:
    - dbus:/run/dbus
    - avahi:/run/avahi-daemon
    - ./config:/etc/spike:ro
    - ./pipes:/pipes
  depends_on:
    nqptp:
      condition: service_started
    mdns:
      condition: service_started
    streamer:
      condition: service_healthy

services:
  nqptp:
    image: mikebrady/shairport-sync:5.6
    entrypoint: ["/usr/local/bin/nqptp"]
    network_mode: host # Owns UDP 319/320
    ipc: host

  mdns:
    image: mikebrady/shairport-sync:5.6
    network_mode: host
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -f /run/dbus/dbus.pid /run/avahi-daemon/pid
        dbus-uuidgen --ensure
        dbus-daemon --system --fork
        sleep 1
        exec avahi-daemon --no-chroot
    volumes:
      - dbus:/run/dbus
      - avahi:/run/avahi-daemon
      - ./config/avahi-daemon.conf:/etc/avahi/avahi-daemon.conf:ro

  kitchen:
    <<: *room
    command: ["-v", "-c", "/etc/spike/kitchen.conf"]

  bedroom:
    <<: *room
    command: ["-v", "-c", "/etc/spike/bedroom.conf"]

  # Reads the raw PCM of both receivers, encodes MP3 live streams, serves the
  # static test file and logs who fetches what.
  streamer:
    image: node:22-alpine
    working_dir: /app
    command:
      - /bin/sh
      - -c
      - apk add --no-cache ffmpeg >/dev/null && exec node server.js
    environment:
      ROOMS: kitchen,bedroom
      UV_THREADPOOL_SIZE: 8 # Each FIFO read blocks one libuv thread
    ports:
      - 8099:8099
    volumes:
      - ./streamer:/app:ro
      - ./pipes:/pipes
      - streamer-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "test -p /pipes/kitchen && test -p /pipes/bedroom"]
      interval: 2s
      retries: 60

  # Public path for the stream: named Cloudflare Tunnel. Token lives in .env
  # (never committed). Only started with --profile tunnel.
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: [tunnel]
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      streamer: {condition: service_healthy}

volumes:
  dbus:
  avahi:
  streamer-data:
