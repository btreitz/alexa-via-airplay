name: alexa-via-airplay

services:
  bridge:
    build: .
    image: alexa-via-airplay:local
    restart: unless-stopped
    # AirPlay discovery (mDNS) and NQPTP's UDP 319/320 need the host network.
    network_mode: host
    cap_add:
      - SYS_NICE
    volumes:
      - data:/data
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false

volumes:
  data:
    # Fixed, so a Portainer stack under any name keeps the existing data.
    name: alexa-via-airplay_data
