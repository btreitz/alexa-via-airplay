# Milestone 1 spike on the Docker LXC. One-shot runs:
#   docker compose run --rm --service-ports ctl login
#   docker compose run --rm ctl devices
# The session lives in ./data (git-ignored, never commit it).
name: alexa-control-spike

services:
  ctl:
    image: node:22-alpine
    working_dir: /app
    network_mode: host # login proxy must be reachable from the browser on the LAN
    entrypoint: ["sh", "-c", "test -d node_modules || npm install --omit=dev --no-audit --no-fund >/dev/null; exec node alexa-control.ts \"$@\"", "--"]
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./:/app

  # Stream side, to see the Echo actually fetch /play.mp3 after the text
  # command. Reuses the earlier spike streamer in test mode (beep file).
  streamer:
    image: node:22-alpine
    profiles: [stream]
    working_dir: /app
    network_mode: host # port 8099, where the existing tunnel route points
    command: ["sh", "-c", "apk add --no-cache ffmpeg >/dev/null && mkdir -p /pipes && exec node server.js"]
    environment:
      ROOMS: m1
    volumes:
      - ../../docs/spikes/server/streamer:/app:ro
      - streamer-data:/data

  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: [stream]
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: [tunnel.env] # TUNNEL_TOKEN=..., git-ignored, never printed

volumes:
  streamer-data:
